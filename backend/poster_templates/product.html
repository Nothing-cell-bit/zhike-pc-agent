<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:__WIDTH__px;height:__HEIGHT__px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;--bg:#f4f1eb;--ink:#232724;--muted:#697069;--accent:#b94f2e;--panel:rgba(255,255,255,.58);--line:rgba(60,65,55,.16)}
body.ember{--bg:#161210;--ink:#efe7d7;--muted:#b5aa97;--accent:#f18a57;--panel:rgba(255,255,255,.045);--line:rgba(239,231,215,.2)}
.scene,.wash,.dots,.glow{position:absolute;inset:0;pointer-events:none}
.scene{width:100%;height:100%;object-fit:cover;opacity:.44}
.wash{background:linear-gradient(180deg,#f4f1eb 0%,rgba(244,241,235,.93) 30%,rgba(244,241,235,.16) 61%,#f4f1eb 87%)}
.ember .scene{opacity:.18}.ember .wash{background:linear-gradient(180deg,#161210 0%,rgba(22,18,16,.9) 29%,rgba(22,18,16,.45) 60%,#161210 88%)}
/* The dot field and single ember glow are adapted from Poster Maker. */
.dots{background-image:radial-gradient(circle at center,rgba(230,98,51,.14) 1.5px,transparent 1.5px);background-size:24px 24px;mask-image:radial-gradient(ellipse 70% 55% at 85% 30%,#000 5%,transparent 72%)}
.glow{inset:auto;left:32%;top:30%;width:900px;height:900px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(230,98,51,.10) 0%,rgba(230,98,51,.04) 45%,transparent 72%)}
.brand,.edition,.kicker,.title,.model,.product,.highlights,.cta,.source{position:absolute;z-index:2}
.brand{left:64px;top:48px;height:29px;font-size:23px;font-weight:700;letter-spacing:3px;display:flex;align-items:center;gap:12px}.brand:before{content:"";display:block;width:9px;height:22px;background:var(--accent)}
.edition{right:64px;top:52px;font-size:16px;letter-spacing:4px;color:var(--muted)}
.kicker{left:64px;top:119px;width:832px;height:30px;color:var(--accent);font-size:22px;letter-spacing:2px}
.title{left:60px;top:168px;width:840px;height:181px;display:flex;align-items:flex-start;font-size:72px;line-height:1.22;font-weight:700;letter-spacing:-2px;overflow-wrap:anywhere}
.title span{display:block;width:100%}.title em{font-style:normal;color:var(--accent)}
.model{left:64px;top:374px;width:832px;height:37px;font-size:26px;letter-spacing:.5px;color:var(--muted)}
.product{left:36px;top:423px;width:888px;height:496px;display:flex;align-items:center;justify-content:center}
.product:before{content:"";position:absolute;width:86%;height:65%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.6),transparent 70%);z-index:-1}
.product img{display:block;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 26px 20px rgba(28,32,25,.11))}
.highlights{left:64px;top:944px;width:832px;height:118px;display:grid;grid-template-columns:repeat(__COUNT__,minmax(0,1fr));gap:14px}
.highlight{border-top:1px solid var(--line);padding:14px 0 0;min-width:0}.number{font-size:14px;font-weight:600;letter-spacing:2px;color:var(--accent);margin-bottom:9px}.highlight p{font-size:20px;line-height:1.45;overflow-wrap:anywhere}.highlights.intro{display:block;border-top:1px solid var(--line);padding-top:18px;font-size:22px;line-height:1.5;color:var(--muted)}
.cta{left:64px;top:1094px;width:832px;height:102px;background:var(--ink);color:var(--bg);display:flex;align-items:center;padding:22px 28px;gap:25px;border-radius:4px}
.cta-text{flex:1;min-width:0;font-size:23px;line-height:1.5}.arrow{width:34px;height:34px;flex-shrink:0;color:var(--accent)}
.source{left:64px;top:1230px;width:832px;height:20px;font-size:13px;color:var(--muted);letter-spacing:.5px}
body:not(.landscape) .title{width:calc(100% - 120px)}body:not(.landscape) .model,body:not(.landscape) .highlights,body:not(.landscape) .cta,body:not(.landscape) .source{width:calc(100% - 128px)}body:not(.landscape) .product{width:calc(100% - 72px)}
body.square .brand{top:40px}body.square .edition{top:44px}body.square .kicker{top:100px}body.square .title{top:146px;height:154px;font-size:63px}body.square .model{top:321px;height:34px;font-size:24px}body.square .product{top:365px;height:345px}body.square .highlights{top:735px;height:108px}body.square .highlight p{font-size:18px}body.square .cta{top:875px;height:91px}body.square .cta-text{font-size:21px}body.square .source{top:991px}
body.landscape .brand{left:64px;top:40px}body.landscape .edition{top:44px}body.landscape .kicker{left:64px;top:123px;width:480px}body.landscape .title{left:60px;top:177px;width:500px;height:212px;font-size:66px}body.landscape .model{left:64px;top:419px;width:500px;height:65px;font-size:24px}body.landscape .product{left:595px;top:112px;width:630px;height:399px}body.landscape .highlights{left:631px;top:549px;width:585px;height:96px;gap:18px}body.landscape .highlight{padding-top:11px}body.landscape .number{margin-bottom:7px}body.landscape .highlight p{font-size:17px}body.landscape .highlights.intro{font-size:20px}body.landscape .cta{left:64px;top:526px;width:500px;height:119px;padding:20px 24px;gap:18px}body.landscape .cta-text{font-size:23px}body.landscape .source{left:64px;top:677px;width:1152px;height:20px}
</style></head>
